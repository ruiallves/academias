<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f6b62" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      Valores de recurso: este ficheiro é estático e igual para todos os clubes.
      `applyBrand()` reescreve os três com a marca da academia mal a app arranca,
      antes do primeiro render — ver `src/lib/brand.ts`. O caminho normal de
      instalação é a landing do clube, que já sai do servidor com o emblema.
    -->
    <meta name="apple-mobile-web-app-title" content="Academias" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="icon" href="/icon-192.png" />
    <!--
      O manifest vem da API, com a marca do clube. O Vite prefixa o `base` a
      caminhos absolutos daqui, por isso em produção isto pede
      `/app/manifest.webmanifest` — que a API também serve, com o mesmo conteúdo
      do da raiz. Ver `tenant-assets.controller.ts`.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Academia Life Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
