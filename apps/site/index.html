<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Entre os dois marcadores, o build escreve o título, a descrição, o canónico,
      as etiquetas de partilha e os dados estruturados de cada página
      (scripts/prerender.mjs a partir de src/lib/seo.ts). O que está aqui é só o
      que se vê em desenvolvimento.
    -->
    <!--seo-->
    <title>Software de gestão de clubes desportivos | Academias</title>
    <meta name="description" content="Software de gestão para clubes desportivos." />
    <link rel="canonical" href="https://www.academias.pt/" />
    <!--/seo-->
    <meta name="theme-color" content="#f5f4f0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Uma letra só: Mona Sans, pesada e ligeiramente estreita nos títulos, normal
      no texto. O produto não precisa de letra aqui: o que se vê dele são capturas.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,400..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
