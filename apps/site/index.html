<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Academias — a infraestrutura digital do teu clube</title>
    <meta
      name="description"
      content="Atletas, equipas, treinos, presenças, convocatórias, mensalidades e a app do clube — para as famílias, os sócios e o staff. Um clube inteiro ligado, sem folhas de Excel nem grupos de WhatsApp."
    />
    <meta name="theme-color" content="#0e332d" />
    <!-- O logótipo, reduzido a partir de images/academias-logo.png. O original
         tem 4096px e quase 1 MB: um separador de browser não precisa disso. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Duas vozes, uma casa.

      Fraunces é a voz institucional: uma serifa com opinião, eixos ópticos, e um
      itálico que sublinha sem gritar — é ela que faz os títulos parecerem de uma
      casa com anos, não de um template. Instrument Sans é a voz de trabalho: a
      mesma do produto, para que o site e a consola falem a mesma língua de perto.
      Geist Mono só numera — preços, datas, meta.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380..680;1,9..144,380..680&family=Instrument+Sans:ital,wght@0,400..700;1,400..500&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Academias — a infraestrutura digital do teu clube" />
    <meta
      property="og:description"
      content="Um clube inteiro ligado: direção, treinadores, atletas, famílias, sócios e pagamentos."
    />
    <meta property="og:locale" content="pt_PT" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
