<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Academias — a infraestrutura digital do teu clube</title>
    <meta
      name="description"
      content="Atletas, equipas, treinos, presenças, convocatórias, mensalidades e a app das famílias. Um clube inteiro ligado, sem folhas de Excel nem grupos de WhatsApp."
    />
    <meta name="theme-color" content="#0e332d" />
    <!-- A bandeirola de canto, sobre o verde da casa. O pano cheio é o que
         sobrevive a 16px num separador de browser. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230e332d'/%3E%3Cpath d='M7.8 4.2 18.4 7.6 7.8 11Z' fill='%238fdcca'/%3E%3Cpath d='M7.8 4.2v15.6' stroke='%238fdcca' stroke-width='1.9' stroke-linecap='round'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Duas vozes, uma casa.

      Fraunces é a voz institucional: uma serifa com opinião, eixos ópticos, e um
      itálico que sublinha sem gritar — é ela que faz os títulos parecerem de uma
      casa com anos, não de um template. Instrument Sans é a voz de trabalho: a
      mesma do produto, para que o site e a consola falem a mesma língua de perto.
      Geist Mono só numera — preços, datas, meta.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380..680;1,9..144,380..680&family=Instrument+Sans:ital,wght@0,400..700;1,400..500&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Academias — a infraestrutura digital do teu clube" />
    <meta
      property="og:description"
      content="Um clube inteiro ligado: direção, treinadores, atletas, famílias e pagamentos."
    />
    <meta property="og:locale" content="pt_PT" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
